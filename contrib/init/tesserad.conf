description "Tessera Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env TESSERAD_BIN="/usr/bin/tesserad"
env TESSERAD_USER="tessera"
env TESSERAD_GROUP="tessera"
env TESSERAD_PIDDIR="/var/run/tesserad"
# upstart can't handle variables constructed with other variables
env TESSERAD_PIDFILE="/var/run/tesserad/tesserad.pid"
env TESSERAD_CONFIGFILE="/etc/tessera/tessera.conf"
env TESSERAD_DATADIR="/var/lib/tesserad"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # tesserad will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$TESSERAD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run tesserad."
        echo "The setting must appear in $TESSERAD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Tessera Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$TESSERAD_PIDDIR"
    chmod 0755 "$TESSERAD_PIDDIR"
    chown $TESSERAD_USER:$TESSERAD_GROUP "$TESSERAD_PIDDIR"
    chown $TESSERAD_USER:$TESSERAD_GROUP "$TESSERAD_CONFIGFILE"
    chmod 0660 "$TESSERAD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$TESSERAD_PIDFILE" \
    --chuid $TESSERAD_USER:$TESSERAD_GROUP \
    --exec "$TESSERAD_BIN" \
    -- \
    -pid="$TESSERAD_PIDFILE" \
    -conf="$TESSERAD_CONFIGFILE" \
    -datadir="$TESSERAD_DATADIR" \
    -disablewallet \
    -daemon

